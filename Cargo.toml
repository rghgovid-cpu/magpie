[package]
name = "magpie"
version = "0.1.0"
edition = "2024"
description = "Magpie — a marketing-focused, open-source OpenCode alternative in Rust. Agentic search & writing, skill marketplace (skill.sh), and PDF/Word printing (A4 & US Letter)."
license = "Beerware"
repository = "https://github.com/YOURUSERNAME/magpie"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }
# Async runtime
tokio = { version = "1", features = ["full"] }
# HTTP client for skill.sh API
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
# URL encoding for skill.sh queries
urlencoding = "2.1"
# Async stream utilities for LLM streaming
futures-util = "0.3"
# JSON / serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Interactive prompts (skill selection + confirmation)
inquire = "0.7"
# Config file (TOML)
toml = "0.8"
# Config / data directories
directories = "5"
# ZIP for DOCX generation
zip = "0.6"
# Error handling
anyhow = "1"
thiserror = "1"
# Spinners / progress
indicatif = "0.7"
# Web server for Magpie web interface (port 7070)
axum = "0.7"
tower-http = { version = "0.5", features = ["fs"] }
# URL detection for automatic brand analysis
regex = "1"
lazy_static = "1"

[workspace]

[profile.release]
opt-level = 3
lto = true
