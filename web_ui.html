<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magpie — Marketing AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --surface: #334155;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --accent-hover: #34d399;
            --border: #475569;
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: -0.5px;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #10b981, #3b82f6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 16px;
            color: white;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
        }

        .status-dot.online {
            background: var(--success);
        }

        /* Main layout */
        main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        aside {
            width: 280px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px 20px 12px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text);
        }

        .nav-item {
            padding: 12px 20px;
            font-size: 14px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            background: var(--surface);
            color: var(--text);
        }

        .nav-item.active {
            background: rgba(124, 58, 237, 0.1);
            color: var(--accent);
            border-left-color: var(--accent);
        }

        .nav-item svg {
            width: 18px;
            height: 18px;
            margin-right: 12px;
        }

        .skills-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 8px;
        }

        .skill-item {
            padding: 12px 16px;
            margin: 4px 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
            display: block;
            text-decoration: none;
            color: inherit;
        }

        .skill-item:hover {
            border-color: var(--accent);
            background: #2a2a2a;
        }

        .skill-item h4 {
            font-size: 14px;
            margin-bottom: 4px;
            color: var(--text);
        }

        .skill-item p {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .skill-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .skill-tag {
            font-size: 10px;
            padding: 2px 8px;
            background: rgba(124, 58, 237, 0.1);
            color: var(--accent);
            border-radius: 4px;
            border: 1px solid rgba(124, 58, 237, 0.2);
        }

        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-muted);
        }

        /* Company setup */
        .company-setup {
            padding: 20px;
            border-top: 1px solid var(--border);
            background: var(--panel);
        }

        .company-setup h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text);
        }

        .company-setup label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .company-setup input {
            width: 100%;
            padding: 8px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 14px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        .company-setup button {
            width: 100%;
            padding: 10px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .company-setup button:hover {
            background: var(--accent-hover);
        }

        .company-setup button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .company-result {
            margin-top: 12px;
            padding: 10px;
            background: var(--surface);
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-muted);
            display: none;
        }

        .company-result.show {
            display: block;
        }

        .company-result .success-line {
            color: var(--success);
            margin-bottom: 6px;
        }

        .company-result .warn-line {
            color: var(--text-muted);
            font-size: 11px;
        }

        /* Chat area */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            overflow: hidden;
        }

        .chat-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
        }

        .chat-header h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .chat-header p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 70%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message-content {
            padding: 14px 20px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 15px;
        }

        .message.user .message-content {
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 4px;
            white-space: pre-wrap;
        }

        .message.assistant .message-content {
            background: var(--panel);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .message.user .message-avatar {
            background: var(--accent);
            color: white;
            align-self: flex-end;
        }

        .message.assistant .message-avatar {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--accent);
            align-self: flex-start;
        }

        /* Input area */
        .input-area {
            padding: 20px 24px;
            background: var(--panel);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            max-width: 800px;
            margin: 0 auto;
        }

        #message-input {
            flex: 1;
            padding: 12px 18px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        #message-input:focus {
            border-color: var(--accent);
        }

        #message-input::placeholder {
            color: var(--text-muted);
        }

        button.send-btn {
            padding: 12px 24px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        button.send-btn:hover {
            background: var(--accent-hover);
        }

        button.send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .typing-indicator {
            font-size: 12px;
            color: var(--text-muted);
            font-style: italic;
            margin-left: 40px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Empty state in chat */
        .chat-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            padding: 40px;
        }

        .chat-empty h3 {
            margin-bottom: 8px;
            color: var(--text);
        }

        .quick-actions {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .quick-btn {
            padding: 10px 18px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-btn:hover {
            background: var(--panel);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Footer */
        footer {
            padding: 12px 24px;
            background: var(--panel);
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Mobile */
        @media (max-width: 768px) {
            aside {
                display: none;
            }

            .message {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <div class="brand-icon">M</div>
            <span>Magpie</span>
        </div>
        <div class="header-right">
            <div class="status-indicator">
                <div class="status-dot" id="status-dot"></div>
                <span id="status-text">Checking LLM...</span>
            </div>
        </div>
    </header>

    <main>
        <aside>
            <div class="sidebar-header">
                <h2>Skills</h2>
            </div>
            <div class="skills-list" id="skills-list">
                <div class="empty-state">Loading skills...</div>
            </div>
        </div>

        <!-- Company Setup -->
        <div class="company-setup">
            <h3>🏢 Company Setup</h3>
            <label for="company-name">Company Name</label>
            <input type="text" id="company-name" placeholder="e.g. Acme Corp" />
            <label for="company-website">Website URL (optional)</label>
            <input type="text" id="company-website" placeholder="https://example.com" />
            <button id="company-setup-btn">Set Up Company</button>
            <div id="company-result" class="company-result"></div>
        </div>
    </aside>

        <div class="chat-container">
            <div class="chat-header">
                <h1>New Conversation</h1>
                <p>Marketing-focused AI assistant</p>
            </div>
            <div class="messages" id="messages">
                <div class="chat-empty">
                    <div style="font-size: 48px; margin-bottom: 16px;">🪶</div>
                    <h3>Start a marketing conversation</h3>
                    <p>Ask Magpie to write copy, plan campaigns, or optimize content.</p>
                    <div class="quick-actions">
                        <button class="quick-btn" onclick="sendQuick('Write a product launch email')">Launch Email</button>
                        <button class="quick-btn" onclick="sendQuick('Create landing page copy')">Landing Page</button>
                        <button class="quick-btn" onclick="sendQuick('Write ad copy for Facebook')">Ad Copy</button>
                        <button class="quick-btn" onclick="sendQuick('SEO blog post outline')">SEO Blog</button>
                        <button class="quick-btn" onclick="sendQuick('Define brand voice guidelines')">Brand Voice</button>
                    </div>
                </div>
            </div>
            <div class="input-area">
                <div class="input-wrapper">
                    <input type="text" id="message-input" placeholder="Ask Magpie about marketing..." />
                    <button class="send-btn" id="send-btn">Send</button>
                </div>
            </div>
        </div>
    </main>

    <footer>
        Magpie — Marketing AI • <span id="port-display">Port 7070</span>
    </footer>

    <script>
        const API_BASE = window.location.origin;
        let isAssistantThinking = false;

        // Elements
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const skillsListEl = document.getElementById('skills-list');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        // Company setup elements
        const companyNameEl = document.getElementById('company-name');
        const companyWebsiteEl = document.getElementById('company-website');
        const companySetupBtn = document.getElementById('company-setup-btn');
        const companyResultEl = document.getElementById('company-result');

        // Initialize
        async function init() {
            await loadSkills();
            await checkLLMStatus();
            await checkCompanySetup();

            // Enter key
            inputEl.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });

            sendBtn.addEventListener('click', sendMessage);
            companySetupBtn.addEventListener('click', setupCompany);

            // Auto-focus
            inputEl.focus();
        }

        async function checkCompanySetup() {
            try {
                const res = await fetch(`${API_BASE}/api/config/llm`);
                const data = await res.json();
                // Just check if knowledge dir has company-name.txt
                // We'll check by trying to read it via a simple endpoint or just show the form
            } catch (err) {
                // Ignore
            }
        }

        async function setupCompany() {
            const companyName = companyNameEl.value.trim();
            const websiteUrl = companyWebsiteEl.value.trim();

            if (!companyName) {
                showCompanyResult("Please enter a company name", false);
                return;
            }

            companySetupBtn.disabled = true;
            companySetupBtn.textContent = "Setting up...";
            companyResultEl.classList.remove('show');
            companyResultEl.textContent = "";

            try {
                const res = await fetch(`${API_BASE}/api/company-setup`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        company_name: companyName,
                        website_url: websiteUrl || undefined,
                    }),
                });

                const data = await res.json();

                if (data.success) {
                    showCompanyResult(data.message, true);
                    companyNameEl.value = "";
                    companyWebsiteEl.value = "";
                } else {
                    showCompanyResult(data.message || "Setup failed", false);
                }
            } catch (err) {
                showCompanyResult("Error: " + err.message, false);
            } finally {
                companySetupBtn.disabled = false;
                companySetupBtn.textContent = "Set Up Company";
            }
        }

        function showCompanyResult(message, success) {
            companyResultEl.textContent = "";
            const successLine = document.createElement("div");
            successLine.className = success ? "success-line" : "warn-line";
            successLine.textContent = success ? "✅ " + message : "❌ " + message;
            companyResultEl.appendChild(successLine);
            companyResultEl.classList.add("show");
        }

        async function checkLLMStatus() {
            try {
                const res = await fetch(`${API_BASE}/api/config/llm`);
                const data = await res.json();
                if (data.configured) {
                    statusDot.className = 'status-dot online';
                    statusText.textContent = 'LLM ready';
                } else {
                    statusDot.className = 'status-dot';
                    statusText.textContent = 'LLM not configured';
                }
            } catch (err) {
                statusDot.className = 'status-dot';
                statusText.textContent = 'Server error';
            }
        }

        async function loadSkills() {
            try {
                const res = await fetch(`${API_BASE}/api/skills`);
                const skills = await res.json();
                renderSkills(skills);
            } catch (err) {
                skillsListEl.innerHTML = '<div class="empty-state">Failed to load skills</div>';
            }
        }

        function renderSkills(skills) {
            if (!skills || skills.length === 0) {
                skillsListEl.innerHTML = '<div class="empty-state">No skills available</div>';
                return;
            }

            skillsListEl.innerHTML = skills.map(s => `
                <div class="skill-item" data-skill="${escapeHtml(s.name)}">
                    <h4>${escapeHtml(s.name)}</h4>
                    <p>${escapeHtml(s.description || '')}</p>
                    <div class="skill-tags">
                        ${(s.tags || []).map(t => `<span class="skill-tag">${escapeHtml(t)}</span>`).join('')}
                    </div>
                </div>
            `).join('');

            // Add click listeners with data-skill attribute (safe for apostrophes)
            skillsListEl.querySelectorAll('.skill-item').forEach(el => {
                el.addEventListener('click', () => {
                    const skillName = el.getAttribute('data-skill');
                    insertSkill(skillName);
                });
            });
        }

        // Simple markdown renderer for chat messages
        function renderMarkdown(text) {
            let html = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            // Headings ###, ##, #
            html = html.replace(/^### (.*$)/gm, '<h4 style="margin: 12px 0 6px 0; font-size: 16px; color: var(--text);">$1</h4>');
            html = html.replace(/^## (.*$)/gm, '<h3 style="margin: 14px 0 7px 0; font-size: 18px; color: var(--text);">$1</h3>');
            html = html.replace(/^# (.*$)/gm, '<h2 style="margin: 16px 0 8px 0; font-size: 22px; color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 4px;">$1</h2>');

            // Bold **text**
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong style="color: var(--accent);">$1</strong>');

            // Italic *text*
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');

            // Bullet lists - lines starting with - or •
            html = html.replace(/^[-•] (.*$)/gm, '<li style="margin: 4px 0; margin-left: 20px;">$1</li>');

            // Wrap consecutive <li> in <ul>
            html = html.replace(/(?:<li[^>]*>.*?<\/li>\s*)+/g, (match) => '<ul style="margin: 8px 0;">' + match + '</ul>');

            // Line breaks
            html = html.replace(/\n/g, '<br>');

            return html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function insertSkill(name) {
            inputEl.value = `Use the ${name} skill to help with marketing.`;
            inputEl.focus();
        }

        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text || isAssistantThinking) return;

            inputEl.value = '';
            sendBtn.disabled = true;
            isAssistantThinking = true;

            // Add user message
            addMessage(text, 'user');
            clearEmptyState();

            // Add assistant placeholder
            const assistantEl = addMessage('', 'assistant');
            const contentEl = assistantEl.querySelector('.message-content');
            const typingEl = document.createElement('div');
            typingEl.className = 'typing-indicator';
            typingEl.textContent = 'Magpie is thinking...';
            assistantEl.appendChild(typingEl);
            scrollToBottom();

            try {
                const res = await fetch(`${API_BASE}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, stream: true })
                });

                if (!res.ok) {
                    throw new Error(`Server error: ${res.status}`);
                }

                const data = await res.json();
                typingEl.remove();
                contentEl.innerHTML = renderMarkdown(data.response || 'No response received.');
            } catch (err) {
                typingEl.remove();
                contentEl.innerHTML = `<span style="color: var(--error);">Error: ${escapeHtml(err.message)}</span>`;
            } finally {
                sendBtn.disabled = false;
                isAssistantThinking = false;
                scrollToBottom();
            }
        }

        function addMessage(text, role) {
            const div = document.createElement('div');
            div.className = `message ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = role === 'user' ? 'You' : 'M';

            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = text;

            div.appendChild(avatar);
            div.appendChild(content);
            messagesEl.appendChild(div);
            scrollToBottom();
            return div;
        }

        function clearEmptyState() {
            const empty = messagesEl.querySelector('.chat-empty');
            if (empty) empty.remove();
        }

        function scrollToBottom() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function sendQuick(text) {
            inputEl.value = text;
            sendMessage();
        }

        // Start
        init();
    </script>
</body>
</html>
